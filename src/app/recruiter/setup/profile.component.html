<body>
    <div class="profile-container">
        <h2>Employer Profile</h2>
        <form (ngSubmit)="onSubmit()">
          
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" name="companyName" [(ngModel)]="companyName" required />
          </div>
      
          <div class="form-group">
            <label>Industry</label>
            <input type="text" name="industry" [(ngModel)]="industry" required />
          </div>
      
          <div class="form-group">
            <label>Company Size</label>
            <select name="size" [(ngModel)]="size" required>
              <option value="">-- Select Size --</option>
              <option value="1-10">1–10</option>
              <option value="11-50">11–50</option>
              <option value="51-200">51–200</option>
              <option value="201-1000">201–1000</option>
              <option value="1000+">1000+</option>
            </select>
          </div>
      
          <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" [(ngModel)]="location" />
          </div>
      
          <div class="form-group">
            <label>Company Bio</label>
            <textarea name="bio" [(ngModel)]="bio"></textarea>
          </div>
      
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" [(ngModel)]="email" required />
          </div>
      
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" [(ngModel)]="phone" />
          </div>
      
          <div class="form-group">
            <label>Website</label>
            <input type="url" name="website" [(ngModel)]="website" />
          </div>
      
          <div class="form-group">
            <label>LinkedIn</label>
            <input type="url" name="linkedin" [(ngModel)]="linkedin" />
          </div>
      
          <button type="submit" [disabled]="!companyName || !industry || !email || !size">
            Save Profile
          </button>
        </form>
      </div>
      
</body>
