<body>
    <div class="profile-container">
        <h2>Profile Setup</h2>
        <form (ngSubmit)="onSubmit()">
      
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" [(ngModel)]="fullName" required />
          </div>
      
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" [(ngModel)]="phone" />
          </div>
      
          <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" [(ngModel)]="location" />
          </div>
      
          <div class="form-group">
            <label>Short Bio</label>
            <textarea name="bio" [(ngModel)]="bio"></textarea>
          </div>
      
          <div class="form-group">
            <label>Skills</label>
            <div class="tag-input-wrapper">
              <div class="tags">
                <span *ngFor="let skill of skills; let i = index" class="tag">
                  {{ skill }} <span class="remove" (click)="removeSkill(i)">×</span>
                </span>
              </div>
              <input
                type="text"
                [(ngModel)]="skillInput"
                name="skillInput"
                (keydown)="addSkill($event)"
                placeholder="Type a skill and press comma or Enter"
                autocomplete="off"
              />
            </div>
          </div>
      
          <div class="form-group">
            <label>Experience Level</label>
            <select name="experience" [(ngModel)]="experience" required>
              <option value="">-- Select --</option>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="expert">Expert</option>
            </select>
          </div>
      
          <div class="form-group">
            <label>Expected Salary</label>
            <input type="text" name="salary" [(ngModel)]="salary" />
          </div>
      
          <div class="form-group">
            <label>LinkedIn</label>
            <input type="url" name="linkedin" [(ngModel)]="linkedin" />
          </div>
      
          <div class="form-group">
            <label>GitHub</label>
            <input type="url" name="github" [(ngModel)]="github" />
          </div>
      
          <button type="submit" [disabled]="!fullName || !skills || !experience">
            Submit
          </button>
        </form>
      </div>
      
</body>
